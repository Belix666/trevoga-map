<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Карта воздушных угроз</title>
<style>
:root{--bg:#f6f6f4;--fg:#1a1a1a;--mut:#6b6b6b;--card:#fff;--bd:#e2e2de;--land:#e9ecef;--land-st:#9aa1a9;--red:#e5484d;--org:#f76b15;--yel:#f5c518;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101113;--fg:#ececec;--mut:#9a9a9a;--card:#1a1b1e;--bd:#2b2d31;--land:#26282c;--land-st:#4a4d54;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101113;--fg:#ececec;--mut:#9a9a9a;--card:#1a1b1e;--bd:#2b2d31;--land:#26282c;--land-st:#4a4d54;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:860px;margin-inline:auto;padding:14px}
h1{font-size:19px;margin:0 0 2px;padding-right:52px}
.sub{color:var(--mut);font-size:13px;margin-bottom:10px}
#theme{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:10;width:42px;height:42px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--fg);font-size:20px;line-height:1;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.leg{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:4px 10px;font-size:13px}
.dot{width:10px;height:10px;border-radius:50%}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:6px;margin-bottom:10px}
.ctl{display:flex;gap:6px;justify-content:flex-end;margin:4px 4px 6px}
.ctl button{border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:8px;width:38px;height:34px;font:600 16px system-ui;cursor:pointer}
#map{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.reg{fill:var(--land);stroke:var(--land-st);transition:fill .3s}
.reg.s1{fill:var(--yel)}
.reg.s2{fill:var(--org)}
.reg.s3{fill:var(--red);animation:pulse 1.6s infinite}
.reg.sel{stroke:var(--fg)}
@keyframes pulse{50%{opacity:.7}}
.rec{margin:4px 0 10px}
.rec h2{font-size:14px;margin:0 0 6px}
.rc{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:6px 10px;margin:0 6px 6px 0;font:inherit;font-size:13px;color:var(--fg);cursor:pointer}
.rc.sel{outline:2px solid var(--fg);outline-offset:1px}
.rc small{color:var(--mut)}
.empty{color:var(--mut);font-size:13px}
#info{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:10px}
.nm{font-weight:600}
.att{font-size:11px;color:var(--mut);margin-top:6px}
</style>
</head>
<body>
<button id="theme" type="button" aria-label="Переключить тему" title="Переключить тему">🌙</button>
<h1>Карта воздушных угроз</h1>
<div class="sub" id="upd">Данные из Telegram-каналов · угроза снимается после отбоя, без отбоя не дольше 12 ч</div>
<div class="leg" id="leg"></div>
<div class="card">
  <div class="ctl"><button id="zin" type="button" aria-label="Приблизить">+</button><button id="zout" type="button" aria-label="Отдалить">−</button><button id="zreset" type="button" aria-label="Вся карта">⟲</button></div>
  <svg id="map" role="img" aria-label="Карта регионов России"></svg>
  <div class="att">Границы: Natural Earth (public domain). Двигайте карту пальцем, масштабируйте щипком.</div>
</div>
<div class="rec">
  <h2>Тревога за последние 15 минут</h2>
  <div id="recent"></div>
</div>
<div id="info">Нажмите на область или на плашку выше, чтобы увидеть детали.</div>
<script>
const NS="http://www.w3.org/2000/svg";
const LBL={3:"Ракетная опасность",2:"Угроза БПЛА",1:"МВШ (воздушный шар)"};
const COL={3:"var(--red)",2:"var(--org)",1:"var(--yel)"};
const TTL=12*60*60*1000,RECENT=15*60000;
let GEO=null,st={},sel=null;
let W=1000,H=541;
let vb={x:0,y:0,w:1000,h:541};
let paths={},boxes={};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ago=ts=>{const m=Math.max(0,Math.round((Date.now()-ts)/60000));if(m<1)return"только что";if(m<60)return m+" мин назад";const h=Math.round(m/60);if(h<24)return h+" ч назад";return Math.round(h/24)+" дн назад"};
const live=c=>st[c]&&Date.now()-st[c].ts<TTL;
const lvl=c=>live(c)?st[c].p:0;
const nameOf=c=>{const f=GEO&&GEO.features.find(x=>x.properties.code===c);return f?f.properties.name:c};

// тема
const themeBtn=$("theme"),themeMedia=matchMedia("(prefers-color-scheme: dark)");
const storedTheme=localStorage.getItem("trevoga_theme");
if(storedTheme==="light"||storedTheme==="dark")document.documentElement.dataset.theme=storedTheme;
const currentTheme=()=>{const t=document.documentElement.dataset.theme;return t==="light"||t==="dark"?t:(themeMedia.matches?"dark":"light")};
function paintTheme(){const dark=currentTheme()==="dark";themeBtn.textContent=dark?"🌙":"☀️";themeBtn.title=dark?"Включить светлую тему":"Включить тёмную тему";themeBtn.setAttribute("aria-label",themeBtn.title)}
themeBtn.onclick=()=>{const next=currentTheme()==="dark"?"light":"dark";document.documentElement.dataset.theme=next;localStorage.setItem("trevoga_theme",next);paintTheme()};
themeMedia.addEventListener?.("change",()=>{if(!localStorage.getItem("trevoga_theme"))paintTheme()});
paintTheme();

// ---- вид карты (viewBox): пан и зум ----
const svg=$("map");
function setVB(){svg.setAttribute("viewBox",`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);applyStroke()}
// толщина обводки: одинаковая на экране при любом масштабе (≈0.6 px, выделенный ≈1.8 px)
function applyStroke(){
  const r=svg.getBoundingClientRect();if(!r.width)return;
  const sw=vb.w/r.width*0.6;
  Object.keys(paths).forEach(c=>paths[c].setAttribute("stroke-width",(sel===c?sw*3:sw).toFixed(4)));
}
function clampVB(){
  vb.w=Math.min(W,Math.max(W/10,vb.w));
  vb.h=vb.w*H/W;
  vb.x=Math.min(W-vb.w,Math.max(0,vb.x));
  vb.y=Math.min(H-vb.h,Math.max(0,vb.y));
}
function fullView(){vb={x:0,y:0,w:W,h:H};clampVB();setVB()}
function toSvg(cx,cy){const r=svg.getBoundingClientRect();return{x:vb.x+(cx-r.left)/r.width*vb.w,y:vb.y+(cy-r.top)/r.height*vb.h}}
function zoomAt(f,cx,cy){
  const p=toSvg(cx,cy);
  const nw=vb.w/f;
  vb.x=p.x-(p.x-vb.x)*(nw/vb.w);
  vb.y=p.y-(p.y-vb.y)*(nw/vb.w);
  vb.w=nw;vb.h=nw*H/W;
  clampVB();setVB();
}
function centerOfMap(){const r=svg.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}}
$("zin").onclick=()=>{const c=centerOfMap();zoomAt(1.4,c.x,c.y)};
$("zout").onclick=()=>{const c=centerOfMap();zoomAt(1/1.4,c.x,c.y)};
$("zreset").onclick=()=>fullView();

svg.addEventListener("wheel",e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY)},{passive:false});

const ptrs=new Map();
let pinch=null,moved=0;
svg.addEventListener("pointerdown",e=>{
  svg.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1)moved=0;
  if(ptrs.size>=2){
    moved=1e9;
    const [a,b]=[...ptrs.values()];
    pinch={dist:Math.hypot(a.x-b.x,a.y-b.y),mid:{x:(a.x+b.x)/2,y:(a.y+b.y)/2}};
  }
});
svg.addEventListener("pointermove",e=>{
  if(!ptrs.has(e.pointerId))return;
  const prev=ptrs.get(e.pointerId);
  const cur={x:e.clientX,y:e.clientY};
  ptrs.set(e.pointerId,cur);
  const r=svg.getBoundingClientRect();
  if(ptrs.size===1){
    moved+=Math.abs(cur.x-prev.x)+Math.abs(cur.y-prev.y);
    vb.x-=(cur.x-prev.x)*vb.w/r.width;
    vb.y-=(cur.y-prev.y)*vb.h/r.height;
    clampVB();setVB();
  }else if(ptrs.size>=2&&pinch){
    const [a,b]=[...ptrs.values()];
    const dist=Math.hypot(a.x-b.x,a.y-b.y);
    const mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
    const f=dist/pinch.dist;
    const p=toSvg(pinch.mid.x,pinch.mid.y);
    const nw=vb.w/f;
    vb.x=p.x-(p.x-vb.x)*(nw/vb.w);
    vb.y=p.y-(p.y-vb.y)*(nw/vb.w);
    vb.w=nw;vb.h=nw*H/W;
    vb.x-=(mid.x-pinch.mid.x)*vb.w/r.width;
    vb.y-=(mid.y-pinch.mid.y)*vb.h/r.height;
    clampVB();setVB();
    pinch={dist,mid};
  }
});
function endPtr(e){
  const wasSingle=ptrs.size===1;
  ptrs.delete(e.pointerId);
  if(e.type==="pointerup"&&wasSingle&&moved<8){
    const el=document.elementFromPoint(e.clientX,e.clientY);
    const p=el&&el.closest?el.closest("path[data-code]"):null;
    if(p)selectRegion(p.dataset.code,false);
  }
  if(ptrs.size<2)pinch=null;
}
svg.addEventListener("pointerup",endPtr);
svg.addEventListener("pointercancel",endPtr);

// ---- построение карты (один раз) ----
function buildMap(){
  svg.innerHTML="";
  paths={};boxes={};
  W=GEO.meta.width;H=GEO.meta.height;
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  const base=document.createElementNS(NS,"g");
  base.setAttribute("id","base");
  GEO.features.forEach(f=>{
    const code=f.properties.code;
    let d="";
    const polys=f.geometry.type==="Polygon"?[f.geometry.coordinates]:f.geometry.coordinates;
    polys.forEach(poly=>poly.forEach(r=>{d+="M"+r.map(p=>p[0]+" "+p[1]).join("L")+"Z"}));
    const path=document.createElementNS(NS,"path");
    path.setAttribute("d",d);
    path.setAttribute("fill-rule","evenodd");
    path.setAttribute("class","reg");
    path.dataset.code=code;
    const t=document.createElementNS(NS,"title");t.textContent=f.properties.name;path.appendChild(t);
    base.appendChild(path);
    paths[code]=path;
  });
  svg.appendChild(base);
  Object.keys(paths).forEach(c=>{const b=paths[c].getBBox();boxes[c]=b});
  fullView();
}
function focusRegion(code){
  const b=boxes[code];if(!b)return;
  let w=Math.max(b.width,b.height*W/H)*1.6;
  w=Math.max(w,W/10);
  const h=w*H/W;
  vb={x:b.x+b.width/2-w/2,y:b.y+b.height/2-h/2,w,h};
  clampVB();setVB();
}
function selectRegion(code,focus){
  sel=code;
  if(focus)focusRegion(code);
  render();
}

// ---- отрисовка состояния ----
function render(){
  if(!GEO)return;
  Object.keys(paths).forEach(c=>{
    const a=lvl(c);
    paths[c].setAttribute("class","reg"+(a?" s"+a:"")+(sel===c?" sel":""));
  });
  applyStroke();
  const cnt={1:0,2:0,3:0};Object.keys(st).forEach(c=>{if(live(c))cnt[st[c].p]++});
  $("leg").innerHTML=[[3,"Ракеты"],[2,"БПЛА"],[1,"МВШ"]].map(([k,n])=>
    `<div class="chip"><span class="dot" style="background:${COL[k]}"></span>${n}: <b>${cnt[k]}</b></div>`).join("")+
    `<div class="chip"><span class="dot" style="background:var(--land)"></span>Нет угрозы</div>`;

  const now=Date.now();
  const recent=Object.keys(st).filter(c=>live(c)&&now-st[c].ts<=RECENT).sort((a,b)=>st[b].ts-st[a].ts);
  $("recent").innerHTML=recent.length?recent.map(c=>
    `<button class="rc${sel===c?" sel":""}" type="button" data-code="${c}"><span class="dot" style="background:${COL[st[c].p]}"></span>${esc(nameOf(c))} <small>${LBL[st[c].p]}, ${ago(st[c].ts)}</small></button>`).join("")
    :`<div class="empty">За последние 15 минут новых тревог нет.</div>`;
  document.querySelectorAll("#recent .rc").forEach(b=>b.onclick=()=>selectRegion(b.dataset.code,true));

  if(sel){
    const e=live(sel)?st[sel]:null;
    $("info").innerHTML=`<div class="nm">${esc(nameOf(sel))}</div>`+
      (e?`<div>${LBL[e.p]} · ${ago(e.ts)}</div><div style="color:var(--mut);font-size:13px;margin-top:4px">${esc(e.src)}: «${esc(e.text)}»</div>`
         :`<div style="color:var(--mut);font-size:13px">Активных угроз нет</div>`);
  }
}

async function load(){
  try{
    const j=await (await fetch("state.json?t="+Date.now(),{cache:"no-store"})).json();
    st=j.state||{};
    if(j.updated)$("upd").textContent=`Данные из Telegram-каналов · обновлено ${ago(j.updated)} · угроза снимается после отбоя, без отбоя не дольше 12 ч`;
  }catch(e){}
  render();
}
fetch("regions.geojson?t="+Date.now()).then(r=>r.json()).then(g=>{GEO=g;buildMap();load();setInterval(load,60000);setInterval(render,30000)});
</script>
</body>
</html>
